name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Haal de code uit GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installeer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Installeer dependencies uit package-lock.json
      - name: Install dependencies
        run: npm ci

      # Controleer de TypeScript/React code met ESLint
      - name: Run lint
        run: npm run lint

      # Bouw de Vite applicatie
      - name: Build frontend
        run: npm run build

      # Controleer of de Docker image gebouwd kan worden
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag woningmatch-frontend:test